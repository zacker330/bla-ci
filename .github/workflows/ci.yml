name: Electron BLA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  desktop:
    if: github.event.repository.private == false
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Unit tests
        run: npm test
      - name: Harden and package both variants
        run: npm run build
      - name: Test packaged applications on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Test packaged applications on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/reports/
            dist/build.json
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload tested application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ runner.os }}-${{ runner.arch }}
          path: dist/artifacts/
          if-no-files-found: error
          retention-days: 7
